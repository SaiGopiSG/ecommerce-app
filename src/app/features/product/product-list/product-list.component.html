<div class="container mt-3">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
    <div class="me-auto mb-2 mb-md-0">
      <input
        type="text"
        class="form-control"
        style="width: 250px;"
        placeholder="Search products..."
        [(ngModel)]="searchTerm"
        (input)="getFilteredProducts()"
      />
    </div>

    <div class="d-flex flex-wrap gap-2">
      <select class="form-select" style="width: 150px;" [(ngModel)]="selectedCategory">
        <option value="">All Categories</option>
        <option value="electronics">Electronics</option>
        <option value="fashion">Fashion</option>
        <option value="books">Books</option>
      </select>

      <select class="form-select" style="width: 150px;" [(ngModel)]="selectedPrice">
        <option value="">All Prices</option>
        <option value="low">Under ₹500</option>
        <option value="mid">₹500–₹2000</option>
        <option value="high">Above ₹2000</option>
      </select>

      <select class="form-select" style="width: 150px;" [(ngModel)]="selectedRating">
        <option value="">All Ratings</option>
        <option value="4">4★ & above</option>
        <option value="3">3★ & above</option>
        <option value="2">2★ & above</option>
      </select>

      <select class="form-select" style="width: 150px;" [(ngModel)]="selectedSort">
        <option value="">Sort By</option>
        <option value="priceAsc">Price: Low to High</option>
        <option value="priceDesc">Price: High to Low</option>
      </select>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th scope="col">Image</th>
          <th scope="col">Name</th>
          <th scope="col">Category</th>
          <th scope="col">Price</th>
          <th scope="col">Rating</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of getFilteredProducts()">
          <td>
            <img [src]="product.image" alt="Product image" class="product-image">
          </td>
          <td>{{ product.name }}</td>
          <td>{{ product.category }}</td>
          <td>₹{{ product.price }}</td>
          <td>
            <ng-container *ngFor="let star of getStars(product.rating)">
              <i class="bi" [ngClass]="{
                'bi-star-fill': star === 'full',
                'bi-star-half': star === 'half',
                'bi-star': star === 'empty',
                'text-warning': true
              }"></i>
            </ng-container>
            <span class="ms-1">({{ product.rating }})</span>
          </td>
          <td>
            <a [routerLink]="['/product', product.id]" class="btn btn-sm btn-outline-primary">
              <i class="bi bi-eye"></i> View
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
