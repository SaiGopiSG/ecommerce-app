<div class="container mt-4">
  <div class="row mb-3">
    <div class="col-md-4">
      <input type="text" class="form-control" placeholder="Search products..." [(ngModel)]="searchTerm" (input)="getFilteredProducts()">
    </div>

    <div class="col-md-2">
      <select class="form-select" [(ngModel)]="selectedCategory">
        <option value="">All Categories</option>
        <option value="electronics">Electronics</option>
        <option value="fashion">Fashion</option>
        <option value="books">Books</option>
      </select>
    </div>
    <div class="col-md-2">
      <select class="form-select" [(ngModel)]="selectedPrice">
        <option value="">All Prices</option>
        <option value="low">Under ₹500</option>
        <option value="mid">₹500–₹2000</option>
        <option value="high">Above ₹2000</option>
      </select>
    </div>
    <div class="col-md-2">
      <select class="form-select" [(ngModel)]="selectedRating">
        <option value="">All Ratings</option>
        <option value="4">4★ & above</option>
        <option value="3">3★ & above</option>
        <option value="2">2★ & above</option>
      </select>
    </div>
    <div class="col-md-2">
      <select class="form-select" [(ngModel)]="selectedSort">
        <option value="">Sort By</option>
        <option value="priceAsc">Price: Low to High</option>
        <option value="priceDesc">Price: High to Low</option>
      </select>
    </div>
  </div>




  <div class="container mt-4">
    <table class="table table-bordered table-hover table-responsive">
      <thead class="table-dark">
        <tr>
          <th scope="col">Image</th>
          <th scope="col">Name</th>
          <th scope="col">Category</th>
          <th scope="col">Price</th>
          <th scope="col">Rating</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of getFilteredProducts()">
          <td>
            <img [src]="product.image" alt="Product image"  class="product-image img-thumbnail">
          </td>
          <td>{{ product.name }}</td>
          <td>{{ product.category }}</td>
          <td>₹{{ product.price }}</td>
          <td>
            <ng-container *ngFor="let star of getStars(product.rating)">
              <i class="bi" [ngClass]="{
      'bi-star-fill': star === 'full',
      'bi-star-half': star === 'half',
      'bi-star': star === 'empty',
      'text-warning': true
    }"></i>
            </ng-container>
            <span class="ms-1">({{ product.rating }})</span>
          </td>
          <td>
            <a [routerLink]="['/product', product.id]" class="btn btn-sm btn-outline-primary">
              <i class="bi bi-eye"></i> View
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
