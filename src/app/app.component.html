<div class="btn-group float-end mb-2 mt-1 ms-1 mx-1" role="group">
  <button
    class="btn btn-sm"
    [ngClass]="themeService.currentTheme === 'light' ? 'btn-primary' : 'btn-outline-primary'"
    (click)="setTheme('light')"
  >
    ☀️ Light
  </button>
  <button
    class="btn btn-sm"
    [ngClass]="themeService.currentTheme === 'dark' ? 'btn-primary' : 'btn-outline-primary'"
    (click)="setTheme('dark')"
  >
    🌙 Dark
  </button>
</div>

<router-outlet></router-outlet>
