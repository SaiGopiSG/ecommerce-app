
<div class="container-fluid py-2 px-3 border-bottom bg-light" [ngClass]="themeService.currentTheme === 'dark' ? 'bg-dark text-white' : 'bg-light text-dark'">
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center">
    <h4 class="mb-2 mb-sm-0">🛍️ Angular E-Commerce</h4>

    <div class="btn-group" role="group">
      <button
        class="btn btn-sm"
        [ngClass]="themeService.currentTheme === 'light' ? 'btn-primary' : 'btn-outline-primary'"
        (click)="setTheme('light')"
      >
        ☀️ Light
      </button>
      <button
        class="btn btn-sm"
        [ngClass]="themeService.currentTheme === 'dark' ? 'btn-primary' : 'btn-outline-primary'"
        (click)="setTheme('dark')"
      >
        🌙 Dark
      </button>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
